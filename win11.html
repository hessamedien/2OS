<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>Windows 11 UI - Advanced</title>
  <style>
    :root {
      --bg-color: rgba(255,255,255,0.2);
      --text-color: white;
      --gradient: linear-gradient(135deg, #3a5bdc, #8f5fe8);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--gradient);
      background-attachment: fixed;
      background-size: cover;
      overflow: hidden;
      color: var(--text-color);
    }

    .taskbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 50px;
      background: var(--bg-color);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.3);
      z-index: 1000;
    }

    .taskbar button {
      background: none;
      border: none;
      margin: 0 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 18px;
      color: var(--text-color);
      cursor: pointer;
      transition: background 0.3s;
    }

    .taskbar button:hover {
      background: rgba(255,255,255,0.3);
    }

    .clock {
      position: absolute;
      right: 20px;
      color: var(--text-color);
      font-weight: bold;
      font-size: 16px;
    }

    .panel {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 500px;
      background: var(--bg-color);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      display: none;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      z-index: 999;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .window {
      position: absolute;
      width: 400px;
      height: 300px;
      background: var(--bg-color);
      backdrop-filter: blur(15px);
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      padding: 10px;
      color: var(--text-color);
      cursor: move;
      z-index: 900;
    }

    .window h3 {
      margin-top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 18px;
      cursor: pointer;
    }

    .dark-mode {
      --bg-color: rgba(0,0,0,0.5);
      --text-color: #eee;
      --gradient: linear-gradient(135deg, #1a1a2e, #3f3f5f);
    }
  </style>
</head>
<body>

  <!-- نوار وظیفه -->
  <div class="taskbar">
    <button onclick="togglePanel('startMenu')">🪟</button>
    <button onclick="togglePanel('explorer')">📁</button>
    <button onclick="togglePanel('notifications')">🔔</button>
    <button onclick="togglePanel('settings')">⚙️</button>
    <button onclick="toggleDarkMode()">🌗</button>
    <button onclick="createWindow()">➕</button>
    <div class="clock" id="clock"></div>
  </div>

  <!-- پنل‌ها -->
  <div class="panel" id="startMenu">
    <h2>منوی استارت</h2>
    <p>برنامه‌ها، جستجو، تنظیمات</p>
  </div>

  <div class="panel" id="explorer">
    <h2>File Explorer</h2>
    <ul>
      <li>📂 Documents</li>
      <li>📂 Pictures</li>
      <li>📂 Music</li>
      <li>📄 Resume.pdf</li>
    </ul>
  </div>

  <div class="panel" id="notifications">
    <h2>اعلان‌ها</h2>
    <p>🔔 به‌روزرسانی جدید در دسترس است</p>
    <p>📧 ایمیل جدید دریافت شد</p>
  </div>

  <div class="panel" id="settings">
    <h2>Quick Settings</h2>
    <p>🔊 صدا: 80%</p>
    <p>💡 روشنایی: 60%</p>
    <p>📶 Wi-Fi: وصل</p>
  </div>

  <!-- پنجره اولیه -->
  <div class="window" id="window1" style="top:100px; left:100px;">
    <h3>پنجره تست <button class="close-btn" onclick="this.parentElement.parentElement.style.display='none'">✖</button></h3>
    <p>این یک پنجره قابل جابجایی است.</p>
  </div>

  <script>
    function togglePanel(id) {
      document.querySelectorAll('.panel').forEach(p => {
        p.style.display = (p.id === id && p.style.display !== 'flex') ? 'flex' : 'none';
      });
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('fa-IR');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // حالت تاریک
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    // جابجایی پنجره‌ها
    document.querySelectorAll('.window').forEach(win => {
      let isDragging = false, offsetX, offsetY;

      win.addEventListener('mousedown', (e) => {
        isDragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
      });

      document.addEventListener('mousemove', (e) => {
        if (isDragging) {
          win.style.left = `${e.clientX - offsetX}px`;
          win.style.top = `${e.clientY - offsetY}px`;
        }
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });
    });

    // ساخت پنجره جدید
    let windowCount = 2;
    function createWindow() {
      const win = document.createElement('div');
      win.className = 'window';
      win.style.top = `${100 + windowCount * 30}px`;
      win.style.left = `${100 + windowCount * 30}px`;
      win.innerHTML = `<h3>پنجره ${windowCount} <button class="close-btn" onclick="this.parentElement.parentElement.remove()">✖</button></h3><p>محتوای پنجره ${windowCount}</p>`;
      document.body.appendChild(win);
      windowCount++;
    }
  </script>

</body>
</html>
